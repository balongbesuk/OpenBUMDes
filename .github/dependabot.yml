version: 2
updates:
  # Konfigurasi Pembaruan Dependensi Otomatis
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Mengabaikan perubahan versi mayor (breaking changes) agar sistem tetap stabil
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Satukan pembaruan minor dan patch ke dalam satu grup Pull Request
    groups:
      dependencies:
        patterns:
          - "*"
